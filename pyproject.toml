[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-memory-system"
version = "0.3.0"
description = "Personal Memory System v0.1 - Phase 1: unified memory model + SQLite foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
personal-memory = "personal_memory.cli:main"

[tool.setuptools.packages.find]
include = ["personal_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
